[project]
name = "mdump"
version = "1.0.0"
description = "Recursively dumps source files into a single Markdown document for easier sharing with generative AI."
authors = [{ name = "ack2406", email = "69360161+ack2406@users.noreply.github.com" }]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.13"

[project.scripts]
mdump = "mdump.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
